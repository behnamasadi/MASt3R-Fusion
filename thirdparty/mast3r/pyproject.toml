[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "MAST3R"
version = "0.0.1"
dependencies = []

[project.optional-dependencies]
full = [
    "scikit-learn",
    "roma",
    "gradio",
    "matplotlib",
    "tqdm",
    "opencv-python",
    "scipy",
    "einops",
    "trimesh",
    "tensorboard",
    "pyglet",
    "huggingface-hub[torch]>=0.22",
]
retrieval = [
    "pyaml",
    "faiss-cpu",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mast3r", "dust3r"]
namespaces = false
